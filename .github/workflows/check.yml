name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3 shellcheck
      - name: Shell syntax and lint
        run: bash -n pretool-memory.sh && shellcheck pretool-memory.sh
      - name: Hook regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Python lint tool
        run: python3 -m pip install ruff==0.16.10
      - name: Python lint
        run: ruff check --select F,E9 tests
      - name: Check isolated demo
        run: bash -n examples/demo.sh && shellcheck examples/demo.sh && bash examples/demo.sh
