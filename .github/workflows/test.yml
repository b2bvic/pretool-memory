name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Check shell syntax
        run: bash -n pretool-memory.sh install.sh tests/test_pretool_memory.sh
      - name: Run contract tests
        run: bash tests/test_pretool_memory.sh
